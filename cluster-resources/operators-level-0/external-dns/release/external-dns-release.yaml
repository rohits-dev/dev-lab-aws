---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: external-dns
  namespace: kube-system
spec:
  chart:
    spec:
      chart: external-dns
      sourceRef:
        kind: HelmRepository
        name: external-dns
      version: "*"
  interval: 5m0s
  timeout: 5m0s
  releaseName: external-dns
  values:
    provider: aws

    policy: sync
   
    domainFilters:
      - "${resource_prefix}.local"

    serviceAccount:
      name: external-dns
      annotations:
        eks.amazonaws.com/role-arn: "${external_dns_iam_role_arn}"
